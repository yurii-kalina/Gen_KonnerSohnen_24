[env:esp32dev]
platform = https://github.com/platformio/platform-espressif32.git#5a03feb5421051e8bf4238d6dd00b322d4fa446a
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@^7.4.1
	ayushsharma82/ElegantOTA@^3.1.7
